name: Build AI Module

on:
  schedule:
    - cron: '37 23 * * *'   # UTC 23:37 = 北京时间 07:37
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate Module
        run: |
          python3 << 'PY'
          import urllib.request

          url = "https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/shadowrocket/global.list"
          content = urllib.request.urlopen(url).read().decode("utf-8")

          rules = []
          for line in content.splitlines():
              line = line.strip()
              if not line or line.startswith("#") or line.startswith("PROCESS-NAME,"):
                  continue
              if ",PROXY" not in line and ",DIRECT" not in line and ",REJECT" not in line:
                  if "no-resolve" in line:
                      line += ",PROXY"
                  else:
                      line += ",PROXY"
              rules.append(line)

          header = """#!name=AI Rules
          #!desc=VPSDance AI 分流规则（自动同步）
          #!author=Auto-generated
          #!homepage=https://github.com/VPSDance/ai-proxy-rules

          [Rule]
          """
          open("AI-Rules.module", "w").write(header + "\n".join(rules) + "\n")
          print(f"Generated {len(rules)} rules")
          PY

      - name: Commit and Push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AI-Rules.module
          
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes"
          else
            # 精确获取 global.list 的最新 commit message
            VPS_MSG=$(curl -s "https://api.github.com/repos/VPSDance/ai-proxy-rules/commits?path=rules/shadowrocket/global.list&per_page=1" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['commit']['message'].split('\n')[0])" 2>/dev/null || echo "")
            
            # 如果获取失败，用自己计算的
            if [ -z "$VPS_MSG" ] || [ "$VPS_MSG" = "null" ]; then
              ADDED=$(git diff --staged --numstat -- AI-Rules.module | awk '{print $1}')
              REMOVED=$(git diff --staged --numstat -- AI-Rules.module | awk '{print $2}')
              
              if [ "$ADDED" -gt 0 ] && [ "$REMOVED" -gt 0 ]; then
                VPS_MSG="chore: update rules (+${ADDED} -${REMOVED})"
              elif [ "$ADDED" -gt 0 ]; then
                VPS_MSG="chore: add rules (+${ADDED})"
              elif [ "$REMOVED" -gt 0 ]; then
                VPS_MSG="chore: remove rules (-${REMOVED})"
              else
                VPS_MSG="chore: update AI module"
              fi
            fi
            
            DIFF=$(git diff --staged -- AI-Rules.module | head -c 8000)
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "diff<<EOF" >> $GITHUB_OUTPUT
            echo "$DIFF" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "message=$VPS_MSG" >> $GITHUB_OUTPUT
            
            git commit -m "$VPS_MSG"
            git push
            echo "Changes committed and pushed: $VPS_MSG"
          fi

      - name: Send email if changed
        if: steps.commit.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: AI-Rules.module 已更新
          to: 1155124287cuhk@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            AI-Rules.module 有新变化，已自动更新。
            
            仓库：https://github.com/TangChenTom/shadowrocket-ai-module
            提交：https://github.com/TangChenTom/shadowrocket-ai-module/commit/${{ github.sha }}
            
            变更内容（前 8000 字符）：${{ steps.commit.outputs.diff }}
